name: Portfolio checks

on:
  pull_request:
    paths:
      - 'resume-website/**'
      - '.github/workflows/portfolio-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resume-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: resume-website/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
